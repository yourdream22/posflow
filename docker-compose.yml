services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: posflow
      POSTGRES_USER: posflow
      POSTGRES_PASSWORD: posflow
    ports:
      - "5432:5432"
    volumes:
      - posflow_pgdata:/var/lib/postgresql/data

volumes:
  posflow_pgdata:
